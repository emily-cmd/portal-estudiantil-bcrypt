<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Portal Estudiantil ESPE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilos.css') }}">
</head>

<body>

<main class="pantalla">

    <div class="paso">
        <span class="numero">1</span>
        Paso 1: Registro
    </div>

    <div class="contenedor">

        <header>
            <h1>Portal Estudiantil ESPE</h1>
            <p>Ingeniería de Seguridad de Software</p>
            <p>Sistema de autenticación con Python y bcrypt</p>
        </header>

        <section class="tarjeta">

            <div class="titulo-formulario">
                <div class="icono">♙</div>
                <div>
                    <h2>Registrar usuario</h2>
                    <p>Crea tu cuenta para acceder al Portal Estudiantil.</p>
                </div>
            </div>

            <form id="formRegistro">

                <label for="usuario">Nuevo usuario</label>
                <input
                    type="text"
                    id="usuario"
                    placeholder="Crea tu usuario"
                    minlength="3"
                    maxlength="40"
                    autocomplete="username"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Crea una contraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmar">Confirmar contraseña</label>
                <input
                    type="password"
                    id="confirmar"
                    placeholder="Confirma tu contraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="btnRegistrar">
                    Registrarse
                </button>

            </form>

            <p id="mensaje" role="status" aria-live="polite"></p>

            <div class="enlace">
                ¿Ya tienes cuenta?
                <a href="/iniciar-sesion">Inicia sesión</a>
            </div>

        </section>

        <footer>
            Universidad de las Fuerzas Armadas ESPE
        </footer>

    </div>

</main>

<script>

const formulario = document.getElementById("formRegistro");
const mensaje = document.getElementById("mensaje");
const boton = document.getElementById("btnRegistrar");

formulario.addEventListener("submit", async function(evento) {

    evento.preventDefault();

    const usuario = document.getElementById("usuario").value.trim();
    const password = document.getElementById("password").value;
    const confirmar = document.getElementById("confirmar").value;

    mensaje.className = "";
    mensaje.textContent = "";

    // Validar nombre de usuario
    if (usuario.length < 3 || usuario.length > 40) {
        mensaje.textContent = "El usuario debe tener entre 3 y 40 caracteres.";
        mensaje.className = "error";
        return;
    }

    // Validar longitud de contraseña
    if (password.length < 8) {
        mensaje.textContent = "La contraseña debe tener al menos 8 caracteres.";
        mensaje.className = "error";
        return;
    }

    // Comprobar que las contraseñas coincidan
    if (password !== confirmar) {
        mensaje.textContent = "Las contraseñas no coinciden.";
        mensaje.className = "error";
        return;
    }

    // Verificar el límite admitido por bcrypt
    if (new TextEncoder().encode(password).length > 72) {
        mensaje.textContent = "La contraseña es demasiado larga.";
        mensaje.className = "error";
        return;
    }

    boton.disabled = true;
    boton.textContent = "Registrando...";

    try {

        // Enviar datos a Python Flask
        const respuesta = await fetch("/registro", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usuario: usuario,
                password: password
            })
        });

        const datos = await respuesta.json();

        mensaje.textContent = datos.mensaje;

        if (respuesta.ok) {

            mensaje.className = "exito";

            // Limpiar formulario
            formulario.reset();

            // Mostrar enlace al inicio de sesión
            const enlaceLogin = document.querySelector(".enlace a");
            enlaceLogin.textContent = "Continuar al inicio de sesión →";

        } else {

            mensaje.className = "error";

        }

    } catch (error) {

        mensaje.textContent = "No se pudo conectar con el servidor.";
        mensaje.className = "error";

    } finally {

        boton.disabled = false;
        boton.textContent = "Registrarse";

    }

});

</script>

</body>
</html>
